<script>
// --- ИНИЦИАЛИЗАЦИЯ TELEGRAM MINI APP ---
const tg = window.Telegram?.WebApp;
if (tg) {
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); // Запрещаем сворачивать шторку при свайпах
}

const PATH_PREFIX = 'assets/'; 
const CONFIG = { cols: 6, rows: 8, gap: 5, totalLevels: 100 };

const ASSETS_TO_LOAD = [
    'bg.jpg', 'btn_play.png', 'btn_pause.png',
    'item1.png', 'item2.png', 'item3.png', 'item4.png', 
    'item5.png', 'item6.png'
];

// --- УМНАЯ ВИБРАЦИЯ (С ПОДДЕРЖКОЙ TELEGRAM HAPTIC) ---
function vibrate(style = 'light') {
    if (tg?.HapticFeedback) {
        if (style === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
        else if (style === 'medium') tg.HapticFeedback.impactOccurred('medium');
        else if (style === 'success') tg.HapticFeedback.notificationOccurred('success');
        else if (style === 'error') tg.HapticFeedback.notificationOccurred('error');
        else tg.HapticFeedback.impactOccurred('light');
        return;
    }
    if (navigator.vibrate) {
        try { 
            let ms = style === 'heavy' ? 60 : (style === 'medium' ? 40 : 20);
            navigator.vibrate(ms); 
        } catch(e){}
    }
}

// --- ПРЕЛОАДЕР ---
function startPreloading() {
    let loaded = 0;
    const total = ASSETS_TO_LOAD.length;
    const loaderText = document.getElementById('loading-text');
    const loader = document.getElementById('loader');
    const app = document.getElementById('app');
    const ui = document.querySelector('.ui-layer');
    let finished = false;

    function finishLoad() {
        if (finished) return;
        finished = true;
        loaderText.innerText = `Раскладываем любовь... 100%`;
        setTimeout(() => {
            loader.style.opacity = '0';
            app.classList.add('loaded'); 
            ui.classList.add('visible'); 
            setTimeout(() => loader.remove(), 400);
        }, 200);
    }

    function checkLoad() {
        if (finished) return;
        loaded++;
        let pct = Math.floor((loaded / total) * 100);
        loaderText.innerText = `Раскладываем любовь... ${pct}%`;
        if (loaded >= total) finishLoad();
    }

    setTimeout(finishLoad, 2500);

    ASSETS_TO_LOAD.forEach(filename => {
        const img = new Image();
        img.onload = checkLoad;
        img.onerror = () => { console.warn("Asset missing:", filename); checkLoad(); };
        img.src = PATH_PREFIX + filename;
    });
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startPreloading);
} else {
    startPreloading();
}

// --- МУЗЫКА ---
let isMusicPlaying = false;
const musicPlayer = document.getElementById('bg-music');
const musicIcon = document.getElementById('music-icon');
function toggleMusic() {
    if (isMusicPlaying) { 
        musicPlayer.pause(); 
        musicIcon.src = PATH_PREFIX + "btn_play.png"; 
        isMusicPlaying = false; 
    } else { 
        musicPlayer.volume = 0.5; 
        musicPlayer.play().then(() => { 
            musicIcon.src = PATH_PREFIX + "btn_pause.png"; 
            isMusicPlaying = true; 
        }).catch(() => { console.log("Music blocked"); }); 
    }
}
function startGame() { Nav.toMap(); if(!isMusicPlaying) toggleMusic(); }

// --- ДАННЫЕ ИГРЫ ---
const DATA = {
    facts: {
        5: "ФАКТ №1:\nМое сердце уже давно\nживет там, где ты. ❤️",
        10: "ФАКТ №2:\nМоя мечта — увезти тебя\nк океану и серфингу. 🏄‍♂️",
        20: "ФАКТ №3:\nТы мотивируешь меня\nстать лучше. 📚",
        30: "ФАКТ №4:\nТвоя вера в меня\nстоит дороже любых\nденег мира. 💎",
        40: "ФАКТ №5:\nТы действуешь на меня\nлучше, чем любой\nбиохакинг. 💊",
        50: "ФАКТ №6:\nМы будем путешествовать\nтак часто, что устанем\nменять чемоданы. ✈️",
        60: "ФАКТ №7:\nЯ работаю 24/7,\nчтобы ты ни в чем\nне нуждалась. 👸",
        70: "ФАКТ №8:\nРасстояние — временно.\nСкоро мы будем\nпросыпаться вместе. 🏠",
        80: "ФАКТ №9:\nТы вдохновляешь меня\nсильнее, чем\nИлон Маск. 🚀",
        90: "ФАКТ №10:\nПострою империю,\nно ты будешь моим\nглавным сокровищем. 🔋",
        100: "ФАКТ №11:\nТы — мое лучшее\nрешение в жизни.\nЛюблю тебя! ❤️"
    },
    win: ["САМАЯ ЛУЧШАЯ 💖", "УМНИЦА! ❤️", "КРАСОТКА! 😍", "ГЕНИАЛЬНО! 🧠", "БОЖЕ, молюсь на тебя 🙏"],
    lose: ["Месяц без сладкого! 🍬❌", "Ещё раз завалишь — с тебя курсовая 🤓", "ЕЩЁ РАЗ ПРОИГРАЕШЬ -\nБУДЕШЬ ЦЕЛОВАТЬ 😘"]
};

let Game = { 
    level: 1, score: 0, target: 0, moves: 0, 
    board: [], selected: null, isProcessing: false, cellSize: 0,
    comboCount: 0
};

const Nav = { 
    toMap: () => { renderMap(); showScreen('screen-map'); }, 
    toGame: (lvl) => { Game.level = lvl; initGame(); showScreen('screen-game'); } 
};

function showScreen(id) { 
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); 
    document.getElementById(id).classList.add('active'); 
}

function renderMap() {
    const container = document.getElementById('map-content'); 
    const svg = document.getElementById('map-svg');
    container.querySelectorAll('.level-node').forEach(n => n.remove()); 
    svg.innerHTML = ''; 
    let unlocked = parseInt(localStorage.getItem('love_progress') || 1);
    let startY = 140, gapY = 100; 
    container.style.height = `${startY + (CONFIG.totalLevels * gapY) + 200}px`;
    let prevX = 0, prevY = 0;
    
    for (let i = 1; i <= CONFIG.totalLevels; i++) {
        let xPercent = 50 + Math.sin(i * 0.75) * 36; 
        let y = startY + (i - 1) * gapY;
        if (i > 1) {
            let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", prevX + "%"); line.setAttribute("y1", prevY); 
            line.setAttribute("x2", xPercent + "%"); line.setAttribute("y2", y);
            line.setAttribute("stroke", "#ff69b4"); line.setAttribute("stroke-width", "5"); 
            line.setAttribute("stroke-opacity", "0.5");
            svg.appendChild(line);
        }
        prevX = xPercent; prevY = y;
        let btn = document.createElement('div');
        let status = i < unlocked ? 'passed' : (i === unlocked ? 'active' : 'locked');
        btn.className = `level-node ${status}`; 
        btn.style.left = `calc(${xPercent}% - 28px)`; 
        btn.style.top = `${y - 28}px`; 
        btn.innerHTML = status === 'locked' ? '🔒' : i;
        if (DATA.facts[i]) {
            btn.innerHTML += `<div style="position:absolute; bottom:-22px; font-size:10px; font-weight:800; color:#ffd700; width:80px; text-align:center;">ФАКТ</div>`;
        }
        btn.onclick = () => { if (status !== 'locked') Nav.toGame(i); };
        container.appendChild(btn);
    }
    setTimeout(() => { 
        document.getElementById('map-container').scrollTo({ 
            top: Math.max(0, (unlocked - 1) * gapY - window.innerHeight / 2 + 100), 
            behavior: 'smooth' 
        }); 
    }, 100);
}

function getColorsCount() { 
    if (Game.level <= 10) return 4;
    if (Game.level <= 35) return 5;
    return 6; 
}

function initGame() {
    Game.score = 0; 
    Game.target = 1200 + (Game.level * 180); 
    Game.moves = Math.min(35, 16 + Math.floor(Game.level / 4)); 
    Game.board = []; 
    Game.isProcessing = false; 
    Game.selected = null; 
    Game.comboCount = 0;
    updateUI(); 
    buildGrid();
}

function buildGrid() {
    const grid = document.getElementById('game-grid'); 
    grid.innerHTML = '';
    let screenW = Math.min(window.innerWidth, 460) - 30;
    Game.cellSize = Math.floor((screenW - (CONFIG.cols - 1) * CONFIG.gap) / CONFIG.cols);
    if(Game.cellSize > 62) Game.cellSize = 62;
    
    grid.style.gridTemplateColumns = `repeat(${CONFIG.cols}, ${Game.cellSize}px)`; 
    grid.style.gap = `${CONFIG.gap}px`; 
    grid.style.width = 'fit-content';

    for (let r = 0; r < CONFIG.rows; r++) {
        Game.board[r] = [];
        for (let c = 0; c < CONFIG.cols; c++) {
            let cell = document.createElement('div'); 
            cell.className = 'cell'; 
            cell.style.width = `${Game.cellSize}px`; 
            cell.style.height = `${Game.cellSize}px`;
            grid.appendChild(cell); 
            createGemNoMatch(r, c);
        }
    }
    
    if (!hasPossibleMoves()) shuffleBoardSilently();
}

function createGemNoMatch(r, c) {
    let type, attempts = 0, max = getColorsCount();
    do { 
        type = Math.floor(Math.random() * max) + 1; 
        attempts++; 
    } while (isMatchAt(r, c, type) && attempts < 50);
    createGemDOM(r, c, type, false);
}

function isMatchAt(r, c, type) {
    if (c >= 2 && Game.board[r][c-1]?.type === type && Game.board[r][c-2]?.type === type) return true;
    if (r >= 2 && Game.board[r-1][c]?.type === type && Game.board[r-2][c]?.type === type) return true;
    return false;
}

const SVG = {
    rocket: `<svg viewBox="0 0 512 512" class="bonus-svg"><path d="M256 16c-50 0-100 80-100 160 0 50 20 120 20 120s-40 20-60 60c0 0 80 0 140 100 60-100 140-100 140-100s-60-40-60-60c0 0 20-70 20-120 0-80-50-160-100-160z" fill="#00e676"/><circle cx="256" cy="150" r="30" fill="white"/></svg>`,
    bomb: `<svg viewBox="0 0 512 512" class="bonus-svg"><circle cx="256" cy="280" r="170" fill="#222"/><path d="M256 110v-60m40 20h-80" stroke="#ff3d00" stroke-width="40" stroke-linecap="round"/><circle cx="220" cy="240" r="25" fill="white" opacity="0.4"/></svg>`,
    plane: `<svg viewBox="0 0 512 512" class="bonus-svg"><path d="M50 100 L450 256 L50 412 L150 256 Z" fill="#29b6f6" stroke="white" stroke-width="20"/></svg>`,
    colorbomb: `<svg viewBox="0 0 100 100" class="bonus-svg rainbow-anim"><circle cx="50" cy="50" r="44" fill="url(#rainbow)" stroke="white" stroke-width="6"/><defs><linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#ff1744;"/><stop offset="25%" style="stop-color:#ffea00;"/><stop offset="50%" style="stop-color:#00e676;"/><stop offset="75%" style="stop-color:#2979ff;"/><stop offset="100%" style="stop-color:#d500f9;"/></linearGradient></defs></svg>`
};

function renderGemContent(gemEl, type) {
    gemEl.innerHTML = '';
    if (typeof type === 'string') {
        gemEl.innerHTML = SVG[type] || '';
    } else {
        let img = document.createElement('img');
        img.src = `${PATH_PREFIX}item${type}.png`;
        img.draggable = false;
        gemEl.appendChild(img);
    }
}

function createGemDOM(r, c, type, anim = true) {
    let gem = document.createElement('div'); 
    gem.className = 'gem'; 
    gem.style.width = `${Game.cellSize}px`; 
    gem.style.height = `${Game.cellSize}px`;
    
    renderGemContent(gem, type);
    
    let x = c * (Game.cellSize + CONFIG.gap); 
    let y = r * (Game.cellSize + CONFIG.gap);
    gem.style.left = `${x}px`; 
    
    if (anim) { 
        gem.style.top = `-${Game.cellSize + 20}px`; 
        requestAnimationFrame(() => {
            setTimeout(() => { gem.style.top = `${y}px`; }, 30);
        });
    } else {
        gem.style.top = `${y}px`;
    }

    let gemData = { type: type, el: gem, r: r, c: c, isBonus: (typeof type === 'string') };
    Game.board[r][c] = gemData;

    bindControls(gemData);
    document.getElementById('game-grid').appendChild(gem);
}

function bindControls(gemData) {
    let startX = 0, startY = 0;
    let el = gemData.el;
    
    el.addEventListener('pointerdown', (e) => {
        if (Game.isProcessing) return;
        startX = e.clientX;
        startY = e.clientY;
    });

    el.addEventListener('pointerup', (e) => {
        if (Game.isProcessing) return;
        let dx = e.clientX - startX;
        let dy = e.clientY - startY;
        let dist = Math.hypot(dx, dy);

        let r = gemData.r;
        let c = gemData.c;

        if (dist > 25) {
            if (Game.selected) {
                Game.selected.el.classList.remove('selected');
                Game.selected = null;
            }
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && c < CONFIG.cols - 1) attemptSwap(gemData, Game.board[r][c + 1]);
                else if (dx < 0 && c > 0) attemptSwap(gemData, Game.board[r][c - 1]);
            } else {
                if (dy > 0 && r < CONFIG.rows - 1) attemptSwap(gemData, Game.board[r + 1][c]);
                else if (dy < 0 && r > 0) attemptSwap(gemData, Game.board[r - 1][c]);
            }
        } else {
            handleCellTap(r, c);
        }
    });
}

function handleCellTap(r, c) {
    if (Game.isProcessing) return;
    let gem = Game.board[r]?.[c];
    if (!gem) return;

    if (gem.isBonus && gem.type !== 'colorbomb') {
        useMove();
        Game.isProcessing = true;
        vibrate('medium');
        explodeSingleBonus(gem).then(runCascadeLoop);
        return;
    }

    if (!Game.selected) {
        Game.selected = gem; 
        gem.el.classList.add('selected');
        vibrate('light');
    } else {
        let prev = Game.selected;
        prev.el.classList.remove('selected');
        Game.selected = null;
        if (prev === gem) return;

        if (Math.abs(prev.r - r) + Math.abs(prev.c - c) === 1) {
            attemptSwap(prev, gem);
        } else {
            Game.selected = gem;
            gem.el.classList.add('selected');
            vibrate('light');
        }
    }
}

function attemptSwap(g1, g2) {
    if (Game.isProcessing || !g1 || !g2) return;
    Game.isProcessing = true;

    executeDOMSwap(g1, g2);

    setTimeout(async () => {
        if (g1.type === 'colorbomb' || g2.type === 'colorbomb') {
            useMove();
            vibrate('heavy');
            let cb = g1.type === 'colorbomb' ? g1 : g2;
            let other = g1.type === 'colorbomb' ? g2 : g1;
            
            if (other.type === 'colorbomb') {
                await explodeEntireBoard();
            } else {
                await explodeColor(other.type, cb);
            }
            await runCascadeLoop();
            return;
        }

        if (g1.isBonus && g2.isBonus) {
            useMove();
            vibrate('heavy');
            await Promise.all([explodeBonusDirect(g1), explodeBonusDirect(g2)]);
            await runCascadeLoop();
            return;
        }

        let matches = findMatches();
        if (matches.length > 0) {
            useMove();
            vibrate('light');
            Game.comboCount = 0;
            await processMatchesList(matches);
            await runCascadeLoop();
        } else {
            vibrate('error');
            executeDOMSwap(g1, g2);
            setTimeout(() => { Game.isProcessing = false; }, 220);
        }
    }, 220);
}

function executeDOMSwap(g1, g2) {
    Game.board[g1.r][g1.c] = g2; 
    Game.board[g2.r][g2.c] = g1;
    let tr = g1.r, tc = g1.c; 
    g1.r = g2.r; g1.c = g2.c; 
    g2.r = tr; g2.c = tc;

    let x1 = g1.c * (Game.cellSize + CONFIG.gap), y1 = g1.r * (Game.cellSize + CONFIG.gap);
    let x2 = g2.c * (Game.cellSize + CONFIG.gap), y2 = g2.r * (Game.cellSize + CONFIG.gap);
    
    g1.el.style.left = `${x1}px`; g1.el.style.top = `${y1}px`;
    g2.el.style.left = `${x2}px`; g2.el.style.top = `${y2}px`;
}

function findMatches() {
    let matches = [];
    
    for (let r = 0; r < CONFIG.rows; r++) {
        let match = [Game.board[r][0]];
        for (let c = 1; c < CONFIG.cols; c++) {
            let cur = Game.board[r][c];
            let prev = Game.board[r][c - 1];
            if (cur && prev && cur.type === prev.type && !cur.isBonus && !prev.isBonus) {
                match.push(cur);
            } else {
                if (match.length >= 3) matches.push(match);
                match = [cur];
            }
        }
        if (match.length >= 3) matches.push(match);
    }

    for (let c = 0; c < CONFIG.cols; c++) {
        let match = [Game.board[0][c]];
        for (let r = 1; r < CONFIG.rows; r++) {
            let cur = Game.board[r][c];
            let prev = Game.board[r - 1][c];
            if (cur && prev && cur.type === prev.type && !cur.isBonus && !prev.isBonus) {
                match.push(cur);
            } else {
                if (match.length >= 3) matches.push(match);
                match = [cur];
            }
        }
        if (match.length >= 3) matches.push(match);
    }

    for (let r = 0; r < CONFIG.rows - 1; r++) {
        for (let c = 0; c < CONFIG.cols - 1; c++) {
            let p1 = Game.board[r][c], p2 = Game.board[r][c+1], p3 = Game.board[r+1][c], p4 = Game.board[r+1][c+1];
            if (p1 && p2 && p3 && p4 && !p1.isBonus && !p2.isBonus && !p3.isBonus && !p4.isBonus) {
                if (p1.type === p2.type && p1.type === p3.type && p1.type === p4.type) {
                    matches.push({ isSquare: true, items: [p1, p2, p3, p4] });
                }
            }
        }
    }
    return matches;
}

async function processMatchesList(matches) {
    if (!matches.length) return;
    
    Game.comboCount++;
    if (Game.comboCount > 1) {
        showComboBadge(Game.comboCount);
        vibrate('medium');
    }

    let counts = {};
    let toRemove = new Set();
    let bonusesToSpawn = [];

    matches.forEach(m => {
        let arr = m.isSquare ? m.items : m;
        arr.forEach(g => {
            if (g) counts[g.r + ',' + g.c] = (counts[g.r + ',' + g.c] || 0) + 1;
        });
    });

    matches.forEach(m => {
        let arr = m.isSquare ? m.items : m;
        let bonusType = null;

        if (arr.length >= 5) bonusType = 'colorbomb';
        else if (m.isSquare) bonusType = 'plane';
        else if (arr.length === 4) bonusType = 'rocket';
        else if (arr.some(g => counts[g.r + ',' + g.c] > 1)) bonusType = 'bomb';

        let root = arr[0];
        if (bonusType && !bonusesToSpawn.some(b => b.r === root.r && b.c === root.c)) {
            bonusesToSpawn.push({ r: root.r, c: root.c, type: bonusType });
        }
        arr.forEach(g => toRemove.add(g));
    });

    let scoreGain = 0;
    toRemove.forEach(gem => {
        if (!gem || !Game.board[gem.r]?.[gem.c]) return;
        let bonus = bonusesToSpawn.find(b => b.r === gem.r && b.c === gem.c);
        if (bonus) {
            gem.type = bonus.type;
            gem.isBonus = true;
            renderGemContent(gem.el, bonus.type);
            gem.el.classList.add('match-anim');
            setTimeout(() => gem.el.classList.remove('match-anim'), 250);
        } else {
            scoreGain += 60;
            spawnScoreFloater(gem.c, gem.r, `+${60 * Game.comboCount}`);
            gem.el.classList.add('match-anim');
            Game.board[gem.r][gem.c] = null;
            setTimeout(() => gem.el.remove(), 220);
        }
    });

    Game.score += scoreGain * Game.comboCount;
    updateUI();
    await new Promise(res => setTimeout(res, 240));
}

async function explodeSingleBonus(gem) {
    await explodeBonusDirect(gem);
}

async function explodeBonusDirect(gem) {
    if (!gem || !Game.board[gem.r]?.[gem.c]) return;
    let r = gem.r, c = gem.c;
    Game.board[r][c] = null;
    gem.el.style.transform = 'scale(1.4)';
    gem.el.style.opacity = '0';
    setTimeout(() => gem.el.remove(), 200);

    let targets = [];
    if (gem.type === 'rocket') {
        for (let i = 0; i < CONFIG.cols; i++) targets.push({ r: r, c: i });
        for (let i = 0; i < CONFIG.rows; i++) targets.push({ r: i, c: c });
    } else if (gem.type === 'bomb') {
        for (let i = r - 1; i <= r + 1; i++) {
            for (let j = c - 1; j <= c + 1; j++) targets.push({ r: i, c: j });
        }
    } else if (gem.type === 'plane') {
        targets.push({ r: r-1, c: c }, { r: r+1, c: c }, { r: r, c: c-1 }, { r: r, c: c+1 });
        let pool = [];
        for (let i = 0; i < CONFIG.rows; i++) {
            for (let j = 0; j < CONFIG.cols; j++) {
                if (Game.board[i][j] && !Game.board[i][j].isBonus) pool.push(Game.board[i][j]);
            }
        }
        if (pool.length) targets.push(pool[Math.floor(Math.random() * pool.length)]);
    }

    let secondaryBonuses = [];
    targets.forEach(t => {
        if (t.r >= 0 && t.r < CONFIG.rows && t.c >= 0 && t.c < CONFIG.cols) {
            let victim = Game.board[t.r][t.c];
            if (victim) {
                if (victim.isBonus) {
                    secondaryBonuses.push(victim);
                } else {
                    Game.score += 100;
                    Game.board[t.r][t.c] = null;
                    victim.el.classList.add('match-anim');
                    setTimeout(() => victim.el.remove(), 200);
                }
            }
        }
    });

    updateUI();
    if (secondaryBonuses.length) {
        await new Promise(res => setTimeout(res, 80));
        await Promise.all(secondaryBonuses.map(b => explodeBonusDirect(b)));
    }
}

async function explodeColor(targetType, bombGem) {
    Game.board[bombGem.r][bombGem.c] = null;
    bombGem.el.style.transform = 'scale(1.5)';
    bombGem.el.style.opacity = '0';
    setTimeout(() => bombGem.el.remove(), 200);

    let targets = [];
    for (let r = 0; r < CONFIG.rows; r++) {
        for (let c = 0; c < CONFIG.cols; c++) {
            if (Game.board[r][c]?.type === targetType) targets.push(Game.board[r][c]);
        }
    }

    targets.forEach((g, idx) => {
        setTimeout(() => {
            if (g && Game.board[g.r]?.[g.c]) {
                Game.board[g.r][g.c] = null;
                Game.score += 150;
                g.el.classList.add('match-anim');
                setTimeout(() => g.el.remove(), 200);
            }
        }, idx * 25);
    });

    updateUI();
    await new Promise(res => setTimeout(res, targets.length * 25 + 250));
}

async function explodeEntireBoard() {
    let all = [];
    for (let r = 0; r < CONFIG.rows; r++) {
        for (let c = 0; c < CONFIG.cols; c++) {
            if (Game.board[r][c]) all.push(Game.board[r][c]);
        }
    }
    all.forEach((g, idx) => {
        setTimeout(() => {
            if (Game.board[g.r]?.[g.c]) {
                Game.board[g.r][g.c] = null;
                Game.score += 100;
                g.el.classList.add('match-anim');
                setTimeout(() => g.el.remove(), 150);
            }
        }, idx * 10);
    });
    updateUI();
    await new Promise(res => setTimeout(res, all.length * 10 + 250));
}

async function runCascadeLoop() {
    let hadMovement = true;
    while (hadMovement) {
        hadMovement = applyGravityAndRefill();
        if (hadMovement) {
            await new Promise(res => setTimeout(res, 280));
            let matches = findMatches();
            if (matches.length > 0) {
                await processMatchesList(matches);
                hadMovement = true;
            } else {
                hadMovement = false;
            }
        }
    }
    checkEndTurnState();
}

function applyGravityAndRefill() {
    let moved = false;
    let max = getColorsCount();

    for (let c = 0; c < CONFIG.cols; c++) {
        let emptyHoles = 0;
        for (let r = CONFIG.rows - 1; r >= 0; r--) {
            if (!Game.board[r][c]) {
                emptyHoles++;
            } else if (emptyHoles > 0) {
                let gem = Game.board[r][c];
                Game.board[r][c] = null;
                Game.board[r + emptyHoles][c] = gem;
                gem.r += emptyHoles;
                
                let y = gem.r * (Game.cellSize + CONFIG.gap);
                gem.el.style.top = `${y}px`;
                moved = true;
            }
        }

        for (let i = 0; i < emptyHoles; i++) {
            let row = i;
            let type = Math.floor(Math.random() * max) + 1;
            createGemDOM(row, c, type, true);
            moved = true;
        }
    }
    return moved;
}

function checkEndTurnState() {
    checkWinCondition();
    if (Game.moves <= 0 || Game.score >= Game.target) {
        Game.isProcessing = false;
        return;
    }
    if (!hasPossibleMoves()) {
        triggerShuffle();
    } else {
        Game.isProcessing = false;
    }
}

function hasPossibleMoves() {
    let temp = Game.board.map(r => r.map(c => c ? c.type : null));
    
    function chk() {
        for (let r = 0; r < CONFIG.rows; r++) {
            for (let c = 0; c < CONFIG.cols - 2; c++) {
                if (temp[r][c] && temp[r][c] === temp[r][c+1] && temp[r][c] === temp[r][c+2]) return true;
            }
        }
        for (let c = 0; c < CONFIG.cols; c++) {
            for (let r = 0; r < CONFIG.rows - 2; r++) {
                if (temp[r][c] && temp[r][c] === temp[r+1][c] && temp[r][c] === temp[r+2][c]) return true;
            }
        }
        return false;
    }

    function swp(r1, c1, r2, c2) {
        let t = temp[r1][c1]; temp[r1][c1] = temp[r2][c2]; temp[r2][c2] = t;
    }

    for (let r = 0; r < CONFIG.rows; r++) {
        for (let c = 0; c < CONFIG.cols; c++) {
            if (!temp[r][c]) continue;
            if (c < CONFIG.cols - 1) {
                swp(r, c, r, c + 1);
                if (chk()) return true;
                swp(r, c, r, c + 1);
            }
            if (r < CONFIG.rows - 1) {
                swp(r, c, r + 1, c);
                if (chk()) return true;
                swp(r, c, r + 1, c);
            }
        }
    }
    return false;
}

function triggerShuffle() {
    Game.isProcessing = true;
    let oldMsg = document.querySelector('.shuffle-msg');
    if (oldMsg) oldMsg.remove();

    let msg = document.createElement('div');
    msg.className = 'shuffle-msg';
    msg.innerText = "Нет ходов! Перемешиваю... 🌪️";
    document.body.appendChild(msg);

    setTimeout(() => {
        shuffleBoardSilently();
        msg.remove();
        Game.isProcessing = false;
        
        let matches = findMatches();
        if (matches.length > 0) {
            Game.isProcessing = true;
            processMatchesList(matches).then(runCascadeLoop);
        }
    }, 1200);
}

function shuffleBoardSilently() {
    let types = [];
    for (let r = 0; r < CONFIG.rows; r++) {
        for (let c = 0; c < CONFIG.cols; c++) {
            if (Game.board[r][c]) types.push(Game.board[r][c].type);
        }
    }

    let attempts = 0;
    do {
        types.sort(() => Math.random() - 0.5);
        let idx = 0;
        for (let r = 0; r < CONFIG.rows; r++) {
            for (let c = 0; c < CONFIG.cols; c++) {
                let item = Game.board[r][c];
                if (item) {
                    item.type = types[idx++];
                    item.isBonus = (typeof item.type === 'string');
                    renderGemContent(item.el, item.type);
                }
            }
        }
        attempts++;
    } while (!hasPossibleMoves() && attempts < 25);
}

function spawnScoreFloater(col, row, text) {
    let floater = document.createElement('div');
    floater.className = 'score-floater';
    floater.innerText = text;
    let x = col * (Game.cellSize + CONFIG.gap) + Game.cellSize / 2;
    let y = row * (Game.cellSize + CONFIG.gap);
    floater.style.left = `${x}px`;
    floater.style.top = `${y}px`;
    document.getElementById('game-grid').appendChild(floater);
    setTimeout(() => floater.remove(), 700);
}

function showComboBadge(count) {
    let b = document.createElement('div');
    b.className = 'combo-badge';
    let words = ['ОТЛИЧНО! 🔥', 'СУПЕР! ⚡', 'НЕВЕРОЯТНО! 💖', 'БОМБЕЗНО! 💥'];
    b.innerText = words[Math.min(count - 2, words.length - 1)];
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 800);
}

function useMove() { 
    Game.moves--; 
    updateUI(); 
}

function updateUI() { 
    document.getElementById('ui-moves').innerText = Game.moves; 
    document.getElementById('ui-score').innerText = `${Game.score} / ${Game.target}`; 
    document.getElementById('ui-level').innerText = `LVL ${Game.level}`; 
    document.getElementById('ui-progress').style.width = `${Math.min(100, (Game.score / Game.target)*100)}%`; 
}

function checkWinCondition() {
    if (Game.score >= Game.target) {
        let u = parseInt(localStorage.getItem('love_progress') || 1); 
        if (Game.level >= u) localStorage.setItem('love_progress', Game.level + 1);
        let f = DATA.facts[Game.level]; 
        vibrate('success');
        showModal(f ? "СЕКРЕТ РАСКРЫТ! ❤️" : "ПОБЕДА!", f || getRandom(DATA.win), "#ff1493", true);
    } else if (Game.moves <= 0) {
        vibrate('error');
        showModal("УПС...", getRandom(DATA.lose), "#555", false);
    }
}

function showModal(t, m, c, w) {
    document.getElementById('modal-title').innerText = t; 
    document.getElementById('modal-title').style.color = c; 
    document.getElementById('modal-text').innerText = m;
    let b = document.getElementById('modal-btn'); 
    b.style.background = c; 
    b.innerText = w ? "ДАЛЬШЕ" : "ЗАНОВО";
    b.onclick = () => { 
        document.getElementById('modal').style.display = 'none'; 
        if (w) Nav.toMap(); else initGame(); 
    };
    document.getElementById('modal').style.display = 'flex';
}

function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

document.addEventListener('keydown', function(e) { 
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyL') { 
        localStorage.setItem('love_progress', CONFIG.totalLevels); 
        alert('Читы: Все уровни открыты'); 
    } 
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyR') { 
        localStorage.setItem('love_progress', 1); 
        alert('Читы: Прогресс сброшен'); 
    } 
});
